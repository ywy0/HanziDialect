<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>汉字方言读音对照</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, "Microsoft YaHei", "Noto Sans SC", sans-serif;
    background: #f5f5f5; color: #333; min-height: 100vh;
  }
  .header {
    background: linear-gradient(135deg, #1a1a2e, #16213e);
    color: #fff; padding: 20px 24px;
  }
  .header h1 { font-size: 20px; font-weight: 600; }
  .search-box { margin-top: 12px; }
  .search-box input {
    width: 100%; max-width: 400px; padding: 10px 14px; font-size: 16px;
    border: none; border-radius: 8px; outline: none;
    font-family: inherit;
  }
  .spk {
    display: inline-flex; align-items: center; justify-content: center;
    width: 24px; height: 24px; border: none; border-radius: 4px;
    background: rgba(0,0,0,.06); color: #666; font-size: 12px;
    cursor: pointer; vertical-align: middle; margin-left: 6px;
    transition: all .15s;
  }
  .spk:hover { background: rgba(0,0,0,.12); color: #333; }
  .spk.playing { background: #e03131; color: #fff; }

  .container { display: flex; min-height: calc(100vh - 100px); }

  /* ── Main area ── */
  .main {
    flex: 1; padding: 24px; overflow-x: auto;
  }
  .lang-row { margin-bottom: 20px; }
  .lang-row .label {
    font-size: 13px; color: #888; margin-bottom: 8px; font-weight: 600;
  }
  .char-grid {
    display: flex; flex-wrap: wrap; align-items: center; gap: 2px 0;
  }
  .char-cell {
    display: flex; flex-direction: column; align-items: center;
    padding: 4px 6px; border-radius: 4px; cursor: default;
    transition: background .1s; min-width: 32px;
  }
  .char-cell .hanzi {
    font-size: 24px; font-weight: 600; line-height: 1.4;
    transition: color .1s;
  }
  .char-cell .pron {
    font-size: 13px; color: #555; line-height: 1.5;
    transition: color .1s;
  }
  .char-cell.punct { min-width: 16px; }
  .char-cell.punct .hanzi { font-size: 18px; color: #999; }
  .char-cell.punct .pron { display: none; }

  /* Hover highlight */
  .char-cell.highlight { background: #fff0f0; }
  .char-cell.highlight .hanzi { color: #e03131; }
  .char-cell.highlight .pron { color: #e03131; }

  .no-result { color: #999; text-align: center; padding: 40px; }

  /* Variant star mark */
  .pron .variant { color: #c0c; font-weight: bold; font-size: 11px; }

  /* ── Sidebar ── */
  .sidebar {
    width: 180px; background: #fff; border-left: 1px solid #eee;
    padding: 20px 16px; flex-shrink: 0;
  }
  .sidebar .section { margin-bottom: 20px; }
  .sidebar h3 {
    font-size: 12px; color: #999; margin-bottom: 8px;
    text-transform: uppercase; letter-spacing: .5px;
  }
  .sidebar select {
    width: 100%; padding: 6px 8px; font-size: 13px; border-radius: 6px;
    border: 1px solid #ddd; background: #fff; font-family: inherit;
    cursor: pointer;
  }
  .sidebar select:focus { border-color: #4a6cf7; outline: none; }

  .lang-item {
    display: flex; align-items: center; gap: 6px;
    padding: 5px 8px; border-radius: 6px; font-size: 13px;
    cursor: pointer; margin-bottom: 2px;
    transition: background .1s;
  }
  .lang-item:hover { background: #f0f0f5; }
  .lang-item input { display: none; }
  .lang-item .box {
    width: 16px; height: 16px; border-radius: 3px;
    border: 2px solid #ccc; display: inline-flex; align-items: center;
    justify-content: center; font-size: 10px; color: #fff;
    transition: all .1s; flex-shrink: 0;
  }
  .lang-item.on .box { background: #4a6cf7; border-color: #4a6cf7; }
  .lang-item .badge {
    font-size: 10px; background: #e8e8f0; color: #666;
    padding: 1px 5px; border-radius: 4px; margin-left: auto;
  }

  @media (max-width: 600px) {
    .sidebar { width: 140px; padding: 16px 10px; }
    .main { padding: 16px; }
    .char-cell .hanzi { font-size: 20px; }
    .char-cell .pron { font-size: 12px; }
  }
</style>
<script src="data/readings.js" defer></script>
<script src="data/st_mapping.js" defer></script>
</head>
<body>

<div class="header">
  <h1>汉字方言读音对照</h1>
  <div style="font-size:12px;color:#aaa;margin-top:4px;">带 * 标注的读音来自对应的繁/简字形</div>
  <div class="search-box">
    <input type="text" id="input" value="" placeholder="请输入汉字，如“你好”">
  </div>
</div>

<div class="container">
  <div class="main" id="main">
    <div class="no-result">加载读音数据中...</div>
  </div>

  <div class="sidebar" id="sidebar">
    <div class="section">
      <h3>原始语言</h3>
      <select id="srcLang"></select>
    </div>
    <div class="section">
      <h3>对应语言</h3>
      <div id="langList"></div>
    </div>
  </div>
</div>

<script>
// ── Config ──
const LANGS = [
  { id: "cmn",    label: "普通话" },
  { id: "yue",    label: "粤语" },
  { id: "hak",    label: "客家话" },
  { id: "wuu_sh", label: "上海话" },
  { id: "wuu_sz", label: "苏州话" },
  { id: "nan",    label: "闽南语(泉漳)" },
  { id: "cdo",    label: "福州话" },
  { id: "teo",    label: "潮州话" },
  { id: "ltc",    label: "中古汉语" },
  { id: "och",    label: "上古汉语" },
  { id: "jpn_on", label: "日语音读" },
  { id: "jpn_kun",label: "日语训读" },
  { id: "kor",    label: "韩语" },
  { id: "vie",    label: "越南语" },
];
const LANG_MAP = Object.fromEntries(LANGS.map(l => [l.id, l]));

let langStack = ["cmn", "yue"]; // [源语言, ...对应语言]，按显示顺序排列

function getPron(data, langId) {
  if (!data) return "";
  let raw = data[langId];
  if (!raw) return "";
  return raw.split(",")[0].trim();
}

function mergePron(data, ch, langId) {
  let pron = getPron(data[ch], langId);
  if (pron) return pron;
  let varCh = ST && ST[ch];
  if (varCh && data[varCh]) {
    let vpron = getPron(data[varCh], langId);
    if (vpron) return vpron + "*";
  }
  return "";
}

// ── Render ──
function render() {
  const text = document.getElementById("input").value;
  const main = document.getElementById("main");
  const chars = [...text];

  if (!text.trim()) {
    main.innerHTML = '<div class="no-result">请输入汉字开始查询</div>';
    return;
  }
  if (!chars.some(ch => DB && DB[ch])) {
    main.innerHTML = '<div class="no-result">未找到读音数据</div>';
    return;
  }

  let html = "";
  for (const langId of langStack) {
    html += '<div class="lang-row">';
    html += `<div class="label">${LANG_MAP[langId]?.label || langId} <span class="spk" data-lang="${langId}">&#9654;</span></div>`;
    html += '<div class="char-grid">';
    for (const ch of chars) {
      const isPunct = /[，。、！？；：""''（）\-\—\s]/.test(ch);
      const pron = mergePron(DB, ch, langId);
      html += `<div class="char-cell${isPunct?" punct":""}" data-char="${escAttr(ch)}" data-pron="${escAttr(pron)}">`;
      html += `<span class="hanzi">${escHtml(ch)}</span>`;
      html += pron ? `<span class="pron">${escHtml(pron)}</span>` : "";
      html += '</div>';
    }
    html += '</div></div>';
  }

  main.innerHTML = html;

  // ── Hover sync ──
  const allCells = main.querySelectorAll(".char-cell");
  for (const cell of allCells) {
    cell.addEventListener("mouseenter", () => {
      const ch = cell.dataset.char;
      main.querySelectorAll(`.char-cell[data-char="${escAttr(ch)}"]`).forEach(c => c.classList.add("highlight"));
    });
    cell.addEventListener("mouseleave", () => {
      const ch = cell.dataset.char;
      main.querySelectorAll(`.char-cell[data-char="${escAttr(ch)}"]`).forEach(c => c.classList.remove("highlight"));
    });
  }
}

function escHtml(s) { return s.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
function escAttr(s) { return s.replace(/["&<>']/g, c => ({'"':'&quot;','&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;'}[c])); }

// ── Sidebar ──
function initSidebar() {
  // Source language dropdown
  const srcSel = document.getElementById("srcLang");
  srcSel.innerHTML = LANGS.map(l => `<option value="${l.id}">${l.label}</option>`).join("");
  srcSel.value = langStack[0];
  srcSel.addEventListener("change", () => {
    const newSrc = srcSel.value;
    if (newSrc !== langStack[0]) {
      setSource(newSrc);
    }
  });

  rebuildLangList();
}

function setSource(newSrc) {
  // 从栈中移除新源语言（如果已在对应语言中）
  const idx = langStack.indexOf(newSrc);
  if (idx > 0) langStack.splice(idx, 1);
  // 插入到栈顶作为新源语言，旧源语言自动变成对应语言
  langStack.unshift(newSrc);
  document.getElementById("srcLang").value = newSrc;
  rebuildLangList();
  render();
}

function rebuildLangList() {
  const list = document.getElementById("langList");
  list.innerHTML = "";

  const srcId = langStack[0];
  const available = LANGS.filter(l => l.id !== srcId);

  for (const lang of available) {
    const div = document.createElement("div");
    const isOn = langStack.indexOf(lang.id) > 0;
    div.className = "lang-item" + (isOn ? " on" : "");
    div.innerHTML = `<span class="box">✓</span><span>${lang.label}</span>`;
    div.addEventListener("click", () => toggleLang(lang.id));
    list.appendChild(div);
  }
}

function toggleLang(langId) {
  const idx = langStack.indexOf(langId);
  if (idx > 0) {
    langStack.splice(idx, 1); // 已在对应语言中，移除
  } else {
    langStack.push(langId);   // 不在栈中，追加到末尾
  }
  rebuildLangList();
  render();
}

// ── Speak ──
const LANG_VOICE = { cmn:"zh-CN", yue:"zh-CN", hak:"zh-CN", wuu_sh:"zh-CN", wuu_sz:"zh-CN", nan:"zh-CN", cdo:"zh-CN", teo:"zh-CN", ltc:"zh-CN", och:"zh-CN", jpn_on:"ja-JP", jpn_kun:"ja-JP", kor:"ko-KR", vie:"vi-VN" };

// pinyin→汉字索引，用于拼读
let PINYIN_CHAR = null;
function buildPinyinIndex() {
  PINYIN_CHAR = {};
  for (const ch of Object.keys(DB)) {
    const p = DB[ch].cmn;
    if (p) {
      const base = p.replace(/[0-9]/g, "");
      if (!PINYIN_CHAR[base]) PINYIN_CHAR[base] = ch;
    }
  }
}

// ── Boot ──
document.getElementById("input").addEventListener("input", render);
document.getElementById("main").addEventListener("click", e => {
  const spk = e.target.closest(".spk");
  if (!spk) return;
  const row = spk.closest(".lang-row");
  if (!row) return;
  const langId = spk.dataset.lang;

  // 日韩越：用原生 TTS 读汉字
  const nativeTts = ["jpn_on","jpn_kun","kor","vie"].includes(langId);
  if (nativeTts) {
    const text = document.getElementById("input").value.trim();
    if (!text) return;
    if (spk.classList.contains("playing")) {
      window.speechSynthesis.cancel();
      document.querySelectorAll(".spk.playing").forEach(el => el.classList.remove("playing"));
      return;
    }
    window.speechSynthesis.cancel();
    document.querySelectorAll(".spk.playing").forEach(el => el.classList.remove("playing"));
    const u = new SpeechSynthesisUtterance(text);
    u.lang = LANG_VOICE[langId];
    u.rate = 0.9;
    u.onend = u.onerror = () => spk.classList.remove("playing");
    spk.classList.add("playing");
    window.speechSynthesis.speak(u);
    return;
  }

  // 拼读：将注音映射为普通话能读的汉字
  const tokens = [];
  for (const cell of row.querySelectorAll(".char-cell:not(.punct)")) {
    const pron = cell.dataset.pron;
    if (!pron) { tokens.push(cell.dataset.char); continue; }
    const base = pron.replace(/[0-9]/g, "").toLowerCase().trim();
    const mapped = PINYIN_CHAR && PINYIN_CHAR[base];
    tokens.push(mapped || cell.dataset.char);
  }
  if (!tokens.length) return;
  if (spk.classList.contains("playing")) {
    window.speechSynthesis.cancel();
    document.querySelectorAll(".spk.playing").forEach(el => el.classList.remove("playing"));
    return;
  }
  window.speechSynthesis.cancel();
  document.querySelectorAll(".spk.playing").forEach(el => el.classList.remove("playing"));
  const u = new SpeechSynthesisUtterance(tokens.join(" "));
  u.lang = "zh-CN";
  u.rate = 0.9;
  u.onend = u.onerror = () => spk.classList.remove("playing");
  spk.classList.add("playing");
  window.speechSynthesis.speak(u);
});
initSidebar();
(function wait() {
  if (typeof DB !== "undefined") {
    buildPinyinIndex();
    render();
    return;
  }
  setTimeout(wait, 50);
})();
</script>
</body>
</html>
